[package]
name = "kompass-core"
description = "The Kompass routing engine: graph, cost, queries"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# JSON Schema (schemars) and TypeScript (ts-rs) for the API types: native tools only (the CLI
# generates web/src/engine/generated/ from them), never the wasm build.
schema = ["dep:schemars", "dep:ts-rs"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
schemars = { version = "=1.2.3", optional = true }
ts-rs = { version = "=12.0.1", optional = true, default-features = false, features = ["serde-compat", "no-serde-warnings"] }

[lints]
workspace = true
