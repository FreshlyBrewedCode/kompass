[package]
name = "kompass-cli"
description = "The Kompass engine on the command line (tests, golden routes, comparisons)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "kompass"
path = "src/main.rs"

[dependencies]
kompass-core = { workspace = true, features = ["schema"] }
kompass-compile.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"

[lints]
workspace = true
