[workspace]
resolver = "3"
members = ["core", "wasm", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.100"

[workspace.dependencies]
kompass-core = { path = "core" }
# The CLI that generates the JS glue must be the same version (flake.nix, ci.yml).
wasm-bindgen = "=0.2.127"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
