[project]
name = "kompass-pipeline"
version = "0.1.0"
description = "Kompass data pipeline: OSM extract → edges.parquet (offline, local)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyarrow==26.0.1",
    "shapely==2.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
